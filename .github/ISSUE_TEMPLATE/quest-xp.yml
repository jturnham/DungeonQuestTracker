name: Quest XP observation
description: Submit a manual XP recorder export for review; reports do not automatically update the addon.
title: "[XP observation] "
body:
  - type: markdown
    attributes:
      value: "Enable the local XP recorder in Options before turning in quests, then use /dqt xp and Copy export. Reports are untrusted evidence, not automatic data corrections. Do not paste your full SavedVariables file or account/character details."
  - type: textarea
    id: export
    attributes:
      label: Recorder export
      description: Paste the complete export, including its two header lines. Export contains timestamps, build, quest IDs and level/XP context, without character/account names.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Reward context and supporting evidence
      description: Note any known XP bonuses or unusual conditions. A cropped reward screenshot or a link to an independently published quest/build-specific reward helps review. Omit personal details. Unknown modifiers are acceptable; do not assume they were absent.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Submission
      options:
        - label: I reviewed the export and understand that this issue is public and observations require maintainer verification.
          required: true
