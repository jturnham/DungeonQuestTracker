name: Validate addon
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked development dependencies
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
          pnpm install --dir Tools --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Validate source and regressions
        shell: pwsh
        run: ./Tools/validate-data.ps1 -DependencyDirectory ./Tools
      - name: Package test artifact
        shell: pwsh
        run: ./Tools/package-release.ps1 -OutputDirectory ./release/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-addon-${{ github.sha }}
          path: release/ci/*.zip
          if-no-files-found: error
          retention-days: 14
